# Ripple's worldwide wind and swell map tiles, made ahead (see README.md). Four times a day, each a little after the
# models' runs are complete on Open-Meteo's bucket (GFS-Wave about 5 h after its 00/06/12/18 UTC start, ECMWF about
# 7–8 h after); a run not complete yet is left for the next time and the old one stays on the map. Wind and swell are
# two jobs side by side, each about 20–30 minutes, so one failing or running long never holds the other back.
# Secrets: CLOUDFLARE_API_TOKEN (allowed to write R2) and CLOUDFLARE_ACCOUNT_ID.
name: Field tiles

on:
  schedule:
    - cron: '15 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  tiles:
    name: ${{ matrix.model }}
    strategy:
      fail-fast: false
      matrix:
        model: [ecmwf, gfswave]
    concurrency:
      group: fields-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node job.mjs --model ${{ matrix.model }} --upload --out out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
